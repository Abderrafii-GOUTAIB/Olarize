post:
  operationId: changeEmployeeAccountLink
  description: Current identity.link.admin required; no self-link. Verified LINK/RELINK or REVOKE with atomic immutable audit and original retry receipts.
  security:
    - keycloak: [profile.read]
  parameters:
    - {name: companyId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: membershipId, in: path, required: true, schema: {type: string, format: uuid}}
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: '#/components/schemas/ChangeEmployeeAccountLinkRequestDto'}
  responses:
    '200':
      description: Current metadata or original confirmed receipt; Cache-Control no-store
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EmployeeAccountLinkResponseDto'}
    '401': {description: Authentication required}
    '403': {description: Current company authority required or self-link forbidden}
    '404': {description: Target or own link unavailable in selected company}
    '400': {description: Invalid unknown or unconfirmed input}
    '409': {description: Stale versions invalid transition duplicate active link or conflicting retry}
    '503': {description: Account verification unavailable; no mutation}
    '500': {description: Persistence or audit failure; full rollback}
