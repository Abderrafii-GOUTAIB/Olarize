path: /api/v1/companies/{companyId}/contracts/expiring
get:
  operationId: listExpiringContracts
  summary: List contracts with recorded expiry in a date range
  description: Return each current contract version whose HR-recorded end date falls inside the inclusive date range. Results are company-scoped and ordered by end date then contract ID. The missing-date coverage count reports current contracts without a recorded end date; it is not an expiry estimate. This read-only endpoint sends no notifications and makes no renewal or legal-validity decision.
  security:
    - keycloak: [profile.read]
  parameters:
    - {$ref: '#/components/parameters/CompanyId'}
    - name: fromDate
      in: query
      required: true
      description: First included end date in YYYY-MM-DD format.
      schema: {type: string, format: date, example: '2027-01-01'}
    - name: toDate
      in: query
      required: true
      description: Last included end date in YYYY-MM-DD format; range may span at most 366 inclusive days.
      schema: {type: string, format: date, example: '2027-12-31'}
    - name: page
      in: query
      required: false
      description: Zero-based result page.
      schema: {type: integer, minimum: 0, default: 0, example: 0}
    - name: pageSize
      in: query
      required: false
      description: Results per page, from 1 to 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 25, example: 25}
  responses:
    '200':
      description: Current contract versions for the requested page. An authorized no-match query returns an empty items list.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ExpiringContractsResponseDto'}
    '400':
      description: A required date is missing or invalid; the range is reversed or overlong; the query contains duplicate or unknown parameters; or pagination is invalid.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    '401':
      description: Missing or invalid Keycloak access token.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    '403':
      description: Current contract.read membership in the selected company is required.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
