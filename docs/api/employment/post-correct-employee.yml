post:
  operationId: correctEmployee
  summary: Correct employee work facts with current versions and a reason
  description: Requires profile.read and current company employee.write. Explicit confirmed full minimum-fact replacement for stable employee/episode IDs. Immutable audit/source versions and dated job projections commit atomically. No contract date or downstream snapshot rewriting.
  security:
    - keycloak: [profile.read]
  parameters:
    - {name: companyId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: employeeId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: episodeId, in: path, required: true, schema: {type: string, format: uuid}}
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: '#/components/schemas/CorrectEmployeeRequestDto'}
  responses:
    '200':
      description: New employee/source versions or original same-key retry outcome
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CorrectedEmployeeResponseDto'}
    '400': {description: Invalid unknown or unconfirmed input}
    '401': {description: Authentication required}
    '403': {description: Current company employee.write required}
    '404': {description: Employee or episode unavailable in this company}
    '409':
      description: Stale versions duplicate reference conflicting retry or dependent intervals
      content:
        application/problem+json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Problem'}
              - type: object
                properties:
                  dependentFacts:
                    type: array
                    items: {type: string, enum: [JOB_INTERVAL, LAST_EMPLOYED_DAY, OTHER_EPISODE]}
    '500': {description: Persistence or audit failure with full rollback}
