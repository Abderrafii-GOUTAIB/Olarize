openapi: 3.0.3
info:
  title: Olarize API
  version: 0.1.0
paths:
  /api/v1/identity:
    get:
      operationId: getCurrentIdentity
      summary: Return the current user ID
      description: Returns currentUserId from the validated Keycloak access token. This identifies the signed-in person and does not grant access to company or HR data. Requires the profile.read scope.
      security:
        - keycloak: [profile.read]
      responses:
        '200':
          description: The signed-in person's Keycloak user ID from the access token.
          content:
            application/json:
              schema:
                type: object
                required: [currentUserId]
                additionalProperties: false
                properties:
                  currentUserId: {type: string, minLength: 1, description: Keycloak user ID of the person currently signed in., example: c0000000-0000-4000-8000-000000000011}
        '401':
          description: Missing or invalid access token; includes WWW-Authenticate Bearer
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: Valid token without required scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/identity/memberships:
    get:
      operationId: listCurrentMemberships
      summary: List my active company memberships
      description: Returns the companies that the signed-in user is currently an active member of. Each item includes the company ID and name, membership ID, current permissions, and membership version. The user is identified from the validated Keycloak access token; no subject or company ID is accepted as proof of membership. If the user has no active memberships, this endpoint returns an empty list. Memberships are loaded from current database state on every request, so changes and revocations are reflected on the next request. Requires the profile.read scope.
      security:
        - keycloak: [profile.read]
      responses:
        '200':
          description: The signed-in user's active company memberships; an empty array means there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CompanyContextResponseDto'}
        '400':
          description: Unsupported query parameters were supplied.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The access token is valid but does not include profile.read.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/identity/company-context:
    get:
      operationId: resolveCurrentCompanyContext
      summary: Resolve my active company context
      description: Returns the company context for one of the signed-in user's current active memberships. Without companyId, the endpoint selects the company when the user has exactly one active membership. If the user has several active memberships, pass one of the companyId values returned by GET /api/v1/identity/memberships. The response includes that membership's current permissions and version. A requested company ID does not grant access; membership is checked against current database state on every request. Requires the profile.read scope.
      security:
        - keycloak: [profile.read]
      parameters:
        - name: companyId
          in: query
          required: false
          description: Optional company UUID from your active memberships. Omit it when you have one active membership; provide it when you have more than one.
          schema: {type: string, format: uuid, example: c0000000-0000-4000-8000-000000000001}
      responses:
        '200':
          description: The selected company and the signed-in user's active membership permissions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyContextResponseDto'}
        '400':
          description: The companyId is malformed or duplicated, an unsupported query parameter was supplied, or companyId is required because the user has multiple active memberships.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The user has no active membership in the requested company, or no active membership can be selected automatically.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/memberships:
    get:
      operationId: listCompanyMemberships
      summary: List memberships for a company
      description: Lists member user IDs, current status, fixed role bundle, explicit permissions and version. Requires profile.read plus an active identity.admin membership in the selected company. The company ID selects scope; it does not grant access. Identity administrators are visible but cannot be changed through this API.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
      responses:
        '200':
          description: Current memberships in the authorized company.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ManagedMembershipResponseDto'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The actor is not an active identity administrator in this company.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/membership-change-previews:
    post:
      operationId: previewMembershipChange
      summary: Preview a company membership change
      description: Previews an exact grant, role change, reactivation or revocation. Copy userId from the membership row to choose the member. Grants and reactivations verify that Keycloak user ID. The signed preview binds the administrator, company, member, action, permissions, versions and reason; it expires after 30 minutes and does not change membership state. Only HR_ADMIN, MANAGER, EMPLOYEE and PAYROLL_OPERATOR bundles are assignable. identity.admin cannot be granted or edited.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MembershipChangePreviewRequestDto'}
      responses:
        '201':
          description: Exact preview for explicit confirmation; no membership state has changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MembershipPreviewResponseDto'}
        '400':
          description: The preview request is malformed or contains an unknown field or role bundle.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The actor is not an active identity administrator in this company.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: The requested target or membership transition is not allowed.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Keycloak could not verify a target subject needed for a grant or reactivation.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/membership-changes/confirm:
    post:
      operationId: confirmMembershipChange
      summary: Confirm a company membership change
      description: Applies only the exact signed preview after checking that it is unexpired and the actor and target versions still match. Requires confirm=true and an idempotency key. Membership and before/after audit commit atomically; permission reductions and revocation apply on the target's next request.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmMembershipChangeRequestDto'}
      responses:
        '200':
          description: The applied membership result. Repeating the same key and payload returns this result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedMembershipResponseDto'}
              example:
                membershipId: c0000000-0000-4000-8000-000000000020
                userId: c0000000-0000-4000-8000-000000000021
                companyId: c0000000-0000-4000-8000-000000000001
                status: ACTIVE
                roleBundle: MANAGER
                permissions: [employee.direct-reports.read]
                version: 2
        '400':
          description: Confirmation body is malformed, contains unknown fields, or confirm is not true.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The actor is no longer an active identity administrator in this company.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: The preview is expired, stale or mismatched, or an idempotency key was reused with different input.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Keycloak could not verify a target subject needed for a grant or reactivation.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/employees:
    post:
      operationId: createEmployee
      summary: Create a minimum employee record
      description: After HR reviews the supplied facts and sets confirm=true, creates a company-scoped employee, first employment episode and atomic audit. Requires profile.read and a current employee.write membership in the selected company. The URL company ID selects scope and never grants access. An exact same-key retry returns the original IDs. This does not create a login, contract, payroll entitlement or legal hiring decision.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEmployeeRequestDto'}
      responses:
        '201':
          description: Employee, first episode and audit committed; identical retry returns the same result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedEmployeeResponseDto'}
        '400':
          description: Required field missing, invalid date, unknown/oversized field, or confirm is not true.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: Current employee.write membership in the selected company is required.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: Reference already exists in this company or the retry key was used with different facts.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/employees/{employeeId}/episodes/{episodeId}/contracts:
    post:
      operationId: createEmploymentContractFacts
      summary: Record contract facts for an employment episode
      description: Stores HR-supplied contract type, dates and source reference for the selected company, employee and episode. Requires profile.read plus current contract.write membership. Every saved version is UNREVIEWED; no legal validity, renewal, eligibility or employment-state decision is made. A missing end date is explicitly NOT_RECORDED. Exact same-key retries return the version originally created.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
        - {$ref: '#/components/parameters/EmployeeId'}
        - {$ref: '#/components/parameters/EpisodeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateContractRequestDto'}
      responses:
        '201':
          description: Contract facts, version 1 and audit evidence were committed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContractResponseDto'}
        '400':
          description: Invalid dates, type code, unsupported field or missing confirmation.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: Current contract.write membership in the selected company is required.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: Employee or episode is unavailable in this company.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: The idempotency key was reused with different facts.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/employees/{employeeId}/episodes/{episodeId}/contracts/{contractId}/corrections:
    post:
      operationId: correctEmploymentContractFacts
      summary: Correct contract facts and preserve the prior version
      description: Appends corrected facts using the current expectedVersion, a reason and evidence reference. Requires profile.read plus current contract.write membership. The new version is UNREVIEWED; stale versions conflict. This does not assess legal validity or alter employment, account or payroll state.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
        - {$ref: '#/components/parameters/EmployeeId'}
        - {$ref: '#/components/parameters/EpisodeId'}
        - {$ref: '#/components/parameters/ContractId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorrectContractRequestDto'}
      responses:
        '200':
          description: New contract facts version and audit evidence were committed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContractResponseDto'}
        '400':
          description: Invalid dates, type code, version, reason, evidence reference or confirmation.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: Current contract.write membership in the selected company is required.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: Contract is unavailable in this company or episode.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: Expected version is stale or the idempotency key was reused with different facts.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/contracts/expiring:
    get:
      operationId: listExpiringContracts
      summary: List contracts with recorded expiry in a date range
      description: Return current contract versions with HR-recorded end dates inside the inclusive range, ordered by end date then contract ID. Includes a separate count of current contracts without a recorded end date. Requires current contract.read membership and profile.read scope. The endpoint is read-only; it does not send notices or assess renewal or legal validity.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
        - {name: fromDate, in: query, required: true, description: First included date in YYYY-MM-DD format., schema: {type: string, format: date, example: '2027-01-01'}}
        - {name: toDate, in: query, required: true, description: Last included date; range is at most 366 inclusive days., schema: {type: string, format: date, example: '2027-12-31'}}
        - {name: page, in: query, required: false, description: Zero-based page number., schema: {type: integer, minimum: 0, default: 0, example: 0}}
        - {name: pageSize, in: query, required: false, description: Page size from 1 to 100; default 25., schema: {type: integer, minimum: 1, maximum: 100, default: 25, example: 25}}
      responses:
        '200':
          description: Page of current contracts matching the range; authorized no-match queries return an empty items list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpiringContractsResponseDto'}
        '400':
          description: Missing or invalid dates, a reversed or overlong range, invalid pagination, duplicate or unsupported query parameters.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: Current contract.read membership in the selected company is required.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Company UUID from the signed-in user's active membership context. It selects a requested scope but does not grant access.
      schema: {type: string, format: uuid, example: c0000000-0000-4000-8000-000000000001}
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: Employee ID owned by the selected company.
      schema: {type: string, format: uuid, example: c0000000-0000-4000-8000-000000000070}
    EpisodeId:
      name: episodeId
      in: path
      required: true
      description: Employment episode that owns the contract facts.
      schema: {type: string, format: uuid, example: c0000000-0000-4000-8000-000000000071}
    ContractId:
      name: contractId
      in: path
      required: true
      description: Contract fact record to correct.
      schema: {type: string, format: uuid, example: c0000000-0000-4000-8000-000000000073}
  securitySchemes:
    keycloak:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/realms/olarize/protocol/openid-connect/auth
          tokenUrl: http://localhost:8081/realms/olarize/protocol/openid-connect/token
          scopes:
            profile.read: Read the authenticated subject
  schemas:
    CreateEmployeeRequestDto:
      type: object
      required: [reference, name, startDate, idempotencyKey, confirm]
      additionalProperties: false
      example:
        reference: EMP-0007
        name: Salma El Idrissi
        startDate: '2026-10-05'
        jobTitle: People Operations Specialist
        department: People Operations
        site: Casablanca
        workEmail: salma@demo.olarize.invalid
        workPhone: '+212 5 22 00 00 00'
        idempotencyKey: dcb466cc-22bb-4a6e-90c1-5e3ff5743480
        confirm: true
      properties:
        reference: {type: string, minLength: 1, maxLength: 64, description: Company-unique reference; leading zeroes retained and surrounding whitespace trimmed.}
        name: {type: string, minLength: 1, maxLength: 200, description: Supplied Unicode legal or display name.}
        startDate: {type: string, format: date, description: First employed civil day.}
        jobTitle: {type: string, maxLength: 200}
        department: {type: string, maxLength: 200}
        site: {type: string, maxLength: 200}
        workEmail: {type: string, format: email, maxLength: 254}
        workPhone: {type: string, maxLength: 32}
        idempotencyKey: {type: string, format: uuid, description: New UUID for a new creation; reuse only for an exact retry.}
        confirm: {type: boolean, enum: [true], description: HR has reviewed and confirmed these exact facts.}
    CreatedEmployeeResponseDto:
      type: object
      required: [employeeId, episodeId, companyId, reference, name, startDate, status, version]
      additionalProperties: false
      example:
        employeeId: c0000000-0000-4000-8000-000000000070
        episodeId: c0000000-0000-4000-8000-000000000071
        companyId: c0000000-0000-4000-8000-000000000001
        reference: EMP-0007
        name: Salma El Idrissi
        startDate: '2026-10-05'
        status: UPCOMING
        version: 1
      properties:
        employeeId: {type: string, format: uuid}
        episodeId: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        reference: {type: string}
        name: {type: string}
        startDate: {type: string, format: date}
        status: {type: string, enum: [UPCOMING, CURRENT], description: Derived from startDate and Africa/Casablanca today; not payroll eligibility.}
        version: {type: integer, format: int64, minimum: 1}
    CreateContractRequestDto:
      type: object
      required: [typeCode, startDate, sourceReference, idempotencyKey, confirm]
      additionalProperties: false
      example:
        typeCode: CDD
        startDate: '2026-09-01'
        endDate: '2027-08-31'
        sourceReference: Synthetic HR archive item DEMO-CONTRACT-0002
        idempotencyKey: 108f9945-6aae-4f39-8ab5-8b11fdb99772
        confirm: true
      properties:
        typeCode: {type: string, enum: [CDI, CDD, SPECIFIED_WORK, UNKNOWN], description: HR-reported code only; the service does not assess legality.}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date, nullable: true, description: Null means no end date was supplied; it does not prove an indefinite contract.}
        sourceReference: {type: string, minLength: 1, maxLength: 200, description: HR source label/reference; no file is uploaded.}
        idempotencyKey: {type: string, format: uuid, description: New UUID for a new contract; reuse only for an exact retry.}
        confirm: {type: boolean, enum: [true], description: HR has confirmed these exact recorded facts.}
    CorrectContractRequestDto:
      type: object
      required: [expectedVersion, typeCode, startDate, sourceReference, reason, evidenceReference, idempotencyKey, confirm]
      additionalProperties: false
      example:
        expectedVersion: 1
        typeCode: CDD
        startDate: '2026-09-01'
        endDate: '2027-12-31'
        sourceReference: Amended synthetic paper contract
        reason: The original end date was transcribed incorrectly.
        evidenceReference: HR archive item DEMO-CONTRACT-AMENDMENT-0001
        idempotencyKey: 894f5ba8-e8f9-459d-921e-51605201fb08
        confirm: true
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1, description: Current version HR reviewed before correcting.}
        typeCode: {type: string, enum: [CDI, CDD, SPECIFIED_WORK, UNKNOWN], description: HR-reported code only; the service does not assess legality.}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date, nullable: true, description: Null means no end date was supplied.}
        sourceReference: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 1000}
        evidenceReference: {type: string, minLength: 1, maxLength: 200, description: Evidence label/reference; no file is uploaded.}
        idempotencyKey: {type: string, format: uuid, description: New UUID for this correction; reuse only for an exact retry.}
        confirm: {type: boolean, enum: [true]}
    ContractResponseDto:
      type: object
      required: [contractId, companyId, employeeId, episodeId, version, typeCode, startDate, endDateCompleteness, sourceReference, reviewState, recordedAt]
      additionalProperties: false
      description: One immutable recorded facts version. UNREVIEWED and NOT_RECORDED describe workflow/data completeness, not legal status.
      example:
        contractId: c0000000-0000-4000-8000-000000000073
        companyId: c0000000-0000-4000-8000-000000000001
        employeeId: c0000000-0000-4000-8000-000000000070
        episodeId: c0000000-0000-4000-8000-000000000071
        version: 1
        typeCode: CDD
        startDate: '2026-09-01'
        endDate: '2027-08-31'
        endDateCompleteness: RECORDED
        sourceReference: Synthetic HR archive item DEMO-CONTRACT-0001
        reviewState: UNREVIEWED
        recordedAt: '2026-09-30T10:00:00Z'
      properties:
        contractId: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        employeeId: {type: string, format: uuid}
        episodeId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
        typeCode: {type: string, enum: [CDI, CDD, SPECIFIED_WORK, UNKNOWN]}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date, nullable: true}
        endDateCompleteness: {type: string, enum: [RECORDED, NOT_RECORDED], description: NOT_RECORDED means no end date was supplied.}
        sourceReference: {type: string}
        reviewState: {type: string, enum: [UNREVIEWED]}
        changeReason: {type: string, nullable: true}
        evidenceReference: {type: string, nullable: true}
        recordedAt: {type: string, format: date-time}
    ExpiringContractsResponseDto:
      type: object
      required: [companyId, fromDate, toDate, asOf, timeZone, items, pagination, currentContractsWithoutRecordedEndDate]
      additionalProperties: false
      description: A bounded page of current versions, plus company-scoped coverage for contracts without a recorded end date.
      example:
        companyId: c0000000-0000-4000-8000-000000000001
        fromDate: '2027-01-01'
        toDate: '2027-12-31'
        asOf: '2026-09-30'
        timeZone: Africa/Casablanca
        items:
          - contractId: c0000000-0000-4000-8000-000000000073
            contractVersion: 1
            employeeId: c0000000-0000-4000-8000-000000000070
            employeeName: Yasmine Bennani
            employeeReference: EMP-0001
            startDate: '2026-09-01'
            endDate: '2027-08-31'
        pagination: {page: 0, pageSize: 25, totalItems: 1, totalPages: 1}
        currentContractsWithoutRecordedEndDate: 0
      properties:
        companyId: {type: string, format: uuid}
        fromDate: {type: string, format: date}
        toDate: {type: string, format: date}
        asOf: {type: string, format: date, description: Current civil date in Africa/Casablanca when this response was built.}
        timeZone: {type: string, example: Africa/Casablanca}
        items:
          type: array
          items: {$ref: '#/components/schemas/ExpiringContractResponseDto'}
        pagination: {$ref: '#/components/schemas/ExpiringContractsPaginationResponseDto'}
        currentContractsWithoutRecordedEndDate: {type: integer, format: int64, minimum: 0, description: Current contracts in this company with no recorded end date; not included in the date-range results.}
    ExpiringContractResponseDto:
      type: object
      required: [contractId, contractVersion, employeeId, employeeName, employeeReference, startDate, endDate]
      additionalProperties: false
      properties:
        contractId: {type: string, format: uuid}
        contractVersion: {type: integer, format: int64, minimum: 1}
        employeeId: {type: string, format: uuid}
        employeeName: {type: string}
        employeeReference: {type: string}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
    ExpiringContractsPaginationResponseDto:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      additionalProperties: false
      properties:
        page: {type: integer, minimum: 0}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        totalItems: {type: integer, format: int64, minimum: 0}
