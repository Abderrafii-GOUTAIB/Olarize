openapi: 3.0.3
info:
  title: Olarize API
  version: 0.1.0
paths:
  /api/v1/identity:
    get:
      operationId: getCurrentIdentity
      summary: Return the authenticated external subject
      description: Returns the subject (sub) from the validated Keycloak access token. This is the identity-provider ID, not an employee ID, and it does not grant access to company or HR data. Requires the profile.read scope.
      security:
        - keycloak: [profile.read]
      responses:
        '200':
          description: The authenticated subject identifier from the access token.
          content:
            application/json:
              schema:
                type: object
                required: [subject]
                additionalProperties: false
                properties:
                  subject: {type: string, minLength: 1}
        '401':
          description: Missing or invalid access token; includes WWW-Authenticate Bearer
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: Valid token without required scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/identity/memberships:
    get:
      operationId: listCurrentMemberships
      summary: List my active company memberships
      description: Returns the companies that the signed-in user is currently an active member of. Each item includes the company ID and name, membership ID, current permissions, and membership version. The user is identified from the validated Keycloak access token; no subject or company ID is accepted as proof of membership. If the user has no active memberships, this endpoint returns an empty list. Memberships are loaded from current database state on every request, so changes and revocations are reflected on the next request. Requires the profile.read scope.
      security:
        - keycloak: [profile.read]
      responses:
        '200':
          description: The signed-in user's active company memberships; an empty array means there are none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CompanyContext'}
        '400':
          description: Unsupported query parameters were supplied.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The access token is valid but does not include profile.read.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/identity/company-context:
    get:
      operationId: resolveCurrentCompanyContext
      summary: Resolve my active company context
      description: Returns the company context for one of the signed-in user's current active memberships. Without companyId, the endpoint selects the company when the user has exactly one active membership. If the user has several active memberships, pass one of the companyId values returned by GET /api/v1/identity/memberships. The response includes that membership's current permissions and version. A requested company ID does not grant access; membership is checked against current database state on every request. Requires the profile.read scope.
      security:
        - keycloak: [profile.read]
      parameters:
        - name: companyId
          in: query
          required: false
          description: Optional company UUID from your active memberships. Omit it when you have one active membership; provide it when you have more than one.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The selected company and the signed-in user's active membership permissions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompanyContext'}
        '400':
          description: The companyId is malformed or duplicated, an unsupported query parameter was supplied, or companyId is required because the user has multiple active memberships.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The user has no active membership in the requested company, or no active membership can be selected automatically.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/memberships:
    get:
      operationId: listCompanyMemberships
      summary: List memberships for a company
      description: Lists membership subjects, current status, fixed role bundle, explicit permissions and version. Requires profile.read plus an active identity.admin membership in the selected company. The company ID selects scope; it does not grant access. Identity administrators are visible but cannot be changed through this API.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
      responses:
        '200':
          description: Current memberships in the authorized company.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ManagedMembership'}
        '401':
          description: Missing or invalid Keycloak access token.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The actor is not an active identity administrator in this company.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/membership-change-previews:
    post:
      operationId: previewMembershipChange
      summary: Preview a company membership change
      description: Previews an exact grant, role change, reactivation or revocation. Grants and reactivations verify the target Keycloak subject. The signed preview binds the actor, company, target, action, permissions, versions and reason; it expires after 30 minutes and does not change membership state. Only HR_ADMIN, MANAGER, EMPLOYEE and PAYROLL_OPERATOR bundles are assignable. identity.admin cannot be granted or edited.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MembershipChangePreviewRequest'}
      responses:
        '201':
          description: Exact preview for explicit confirmation; no membership state has changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MembershipChangePreview'}
        '400':
          description: The preview request is malformed or contains an unknown field or role bundle.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The actor is not an active identity administrator in this company.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: The requested target or membership transition is not allowed.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Keycloak could not verify a target subject needed for a grant or reactivation.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/companies/{companyId}/membership-changes/confirm:
    post:
      operationId: confirmMembershipChange
      summary: Confirm a company membership change
      description: Applies only the exact signed preview after checking that it is unexpired and the actor and target versions still match. Requires confirm=true and an idempotency key. Membership and before/after audit commit atomically; permission reductions and revocation apply on the target's next request.
      security:
        - keycloak: [profile.read]
      parameters:
        - {$ref: '#/components/parameters/CompanyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmMembershipChangeRequest'}
      responses:
        '200':
          description: The applied membership result. Repeating the same key and payload returns this result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedMembership'}
        '400':
          description: Confirmation body is malformed, contains unknown fields, or confirm is not true.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: The actor is no longer an active identity administrator in this company.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: The preview is expired, stale or mismatched, or an idempotency key was reused with different input.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Keycloak could not verify a target subject needed for a grant or reactivation.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Company UUID from the signed-in user's active membership context. It selects a requested scope but does not grant access.
      schema: {type: string, format: uuid}
  securitySchemes:
    keycloak:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/realms/olarize/protocol/openid-connect/auth
          tokenUrl: http://localhost:8081/realms/olarize/protocol/openid-connect/token
          scopes:
            profile.read: Read the authenticated subject
  schemas:
    CompanyContext:
      type: object
      required: [membershipId, companyId, companyName, permissions, version]
      additionalProperties: false
      properties:
        membershipId: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        companyName: {type: string}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string}
        version: {type: integer, format: int64, minimum: 1}
    ManagedMembership:
      type: object
      required: [membershipId, subject, companyId, status, permissions, version]
      additionalProperties: false
      properties:
        membershipId: {type: string, format: uuid}
        subject: {type: string, minLength: 1}
        companyId: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, REVOKED]}
        roleBundle: {type: string, nullable: true, enum: [HR_ADMIN, MANAGER, EMPLOYEE, PAYROLL_OPERATOR]}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string}
        version: {type: integer, format: int64, minimum: 1}
    MembershipChangePreviewRequest:
      type: object
      required: [targetSubject, reason]
      additionalProperties: false
      properties:
        targetSubject: {type: string, minLength: 1, maxLength: 255, description: Exact opaque Keycloak subject; never an email or username.}
        roleBundle: {type: string, nullable: true, enum: [HR_ADMIN, MANAGER, EMPLOYEE, PAYROLL_OPERATOR], description: Omit only to revoke an active ordinary membership.}
        reason: {type: string, minLength: 1, maxLength: 1000}
    MembershipChangePreview:
      type: object
      required: [previewToken, previewId, companyId, targetSubject, action, permissions, actorVersion, targetVersion, expiresAt]
      additionalProperties: false
      properties:
        previewToken: {type: string, description: Signed opaque token binding the exact proposed change.}
        previewId: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        targetSubject: {type: string}
        action: {type: string, enum: [GRANT, UPDATE, REACTIVATE, REVOKE]}
        roleBundle: {type: string, nullable: true, enum: [HR_ADMIN, MANAGER, EMPLOYEE, PAYROLL_OPERATOR]}
        permissions:
          type: array
          items: {type: string}
        actorVersion: {type: integer, format: int64, minimum: 1}
        targetVersion: {type: integer, format: int64, minimum: 0}
        expiresAt: {type: string, format: date-time}
    ConfirmMembershipChangeRequest:
      type: object
      required: [previewToken, expectedTargetVersion, idempotencyKey, confirm]
      additionalProperties: false
      properties:
        previewToken: {type: string}
        expectedTargetVersion: {type: integer, format: int64, minimum: 0}
        idempotencyKey: {type: string, format: uuid}
        confirm: {type: boolean, enum: [true], description: Explicit confirmation of the exact preview.}
    Problem:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        requestId: {type: string}
