name: Olarize backend
on:
  pull_request:
    paths: ["backend/**", "scripts/**", "compose*.yaml", "infra/keycloak/**", "deploy/**", ".github/workflows/backend.yml"]
  push:
    branches: [master, develop]
    paths: ["backend/**", "scripts/**", "compose*.yaml", "infra/keycloak/**", "deploy/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend with PostgreSQL containers
        run: ./scripts/verify-backend.sh
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
          KEYCLOAK_DB_PASSWORD: ci-only-keycloak
          KEYCLOAK_ADMIN_PASSWORD: ci-only-admin
          DB_SCOPE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --tag olarize-backend:ci backend
