spring:
  application:
    name: olarize
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"

olarize:
  auth:
    issuer: ${AUTH_ISSUER}
    jwk-set-uri: ${AUTH_JWK_SET_URI}
    audience: ${AUTH_AUDIENCE:olarize-api}
    client-id: ${AUTH_CLIENT_ID:olarize-web}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
