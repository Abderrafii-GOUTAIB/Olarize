# Local development only. Shared environments run migrations once before rollout.
spring:
  config:
    activate:
      on-profile: "local & !dev & !prod & !migrate"
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:olarize}}
    username: ${DB_USERNAME:olarize_runtime}
    password: ${DB_PASSWORD:${LOCAL_RUNTIME_PASSWORD:${POSTGRES_PASSWORD}}}
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:olarize}}}
    user: ${FLYWAY_USER:${POSTGRES_USER:olarize}}
    password: ${FLYWAY_PASSWORD:${POSTGRES_PASSWORD}}
    locations: classpath:db/migration,classpath:db/local
    placeholders:
      local_runtime_password: ${LOCAL_RUNTIME_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD}}}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:${BACKEND_PORT:8080}}

olarize:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:${KEYCLOAK_PORT:8081}/realms/olarize}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8081}/realms/olarize/protocol/openid-connect/certs}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      client-id: olarize-web
      use-pkce-with-authorization-code-grant: true
